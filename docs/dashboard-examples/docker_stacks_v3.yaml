type: sections
max_columns: 4
title: Docker Stacks v3
path: docker-stacks-v3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Active Stacks
        heading_style: subtitle
        grid_options:
          columns: 12
      - type: custom:auto-entities
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        max: 30
        filter:
          include:
            - entity_id: sensor.*_state
              attributes:
                icon: mdi:layers-outline
              state: running
              options:
                type: custom:button-card
                entity: this.entity_id
                show_name: true
                show_state: false
                show_icon: true
                name: |
                  [[[ return hass.entities[entity.entity_id]?.device_id
                        ? hass.devices[hass.entities[entity.entity_id].device_id]?.name_by_user
                          || hass.devices[hass.entities[entity.entity_id].device_id]?.name
                        : entity.entity_id; ]]]
                label: |
                  [[[
                    const prefix = entity.entity_id.split('.')[1].split('_state')[0];
                    const s = hass.states['binary_sensor.' + prefix + '_update_available'];
                    if (!s || s.state === 'unknown' || s.state === 'unavailable') return '';
                    return s.state === 'on' ? 'update available' : 'up to date';
                  ]]]
                icon: |
                  [[[
                    switch (entity.state) {
                      case 'running': return 'mdi:play-circle';
                      case 'updating': return 'mdi:progress-clock';
                      case 'partial': return 'mdi:alert-circle';
                      default: return 'mdi:stop-circle';
                    }
                  ]]]
                custom_fields:
                  update_badge: |
                    [[[
                      const prefix = entity.entity_id.split('.')[1].split('_state')[0];
                      const s = hass.states['binary_sensor.' + prefix + '_update_available'];
                      return s && s.state === 'on'
                        ? '<ha-icon icon="mdi:arrow-up-bold-circle" style="color: var(--warning-color, #FAC775); width: 16px; height: 16px;"></ha-icon>'
                        : '';
                    ]]]
                styles:
                  card:
                    - padding: 8px
                    - min-height: 70px
                    - position: relative
                  icon:
                    - width: 24px
                    - color: |
                        [[[
                          switch (entity.state) {
                            case 'running': return 'var(--success-color, green)';
                            case 'updating': return 'var(--info-color, #378ADD)';
                            case 'partial': return 'var(--warning-color, #FAC775)';
                            default: return 'var(--disabled-text-color, grey)';
                          }
                        ]]]
                  name:
                    - font-size: 13px
                  label:
                    - font-size: 11px
                    - color: var(--secondary-text-color)
                  custom_fields:
                    update_badge:
                      - position: absolute
                      - top: 6px
                      - right: 6px
                tap_action:
                  action: call-service
                  service: input_text.set_value
                  service_data:
                    entity_id: input_text.selected_stack
                    value: |
                      [[[
                        return entity.entity_id.split('.')[1].split('_state')[0];
                      ]]]
                hold_action:
                  action: more-info
            - entity_id: sensor.*_state
