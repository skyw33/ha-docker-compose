# HA Docker Compose Manager: "Docker Stacks" dashboard view
#
# Nothing in this file needs editing. Sites, stacks and containers are discovered from the
# integration's own entities, so it works whatever you named your sites.
#
# Requirements
#   1. custom:button-card (install from HACS)
#   2. Two helpers. Create them under Settings > Devices & services > Helpers, or add this
#      to configuration.yaml and restart:
#
#        input_text:
#          selected_stack:
#            name: Selected stack
#            max: 255
#        input_number:
#          container_log_index:
#            name: Container log index
#            min: 0
#            max: 99
#            step: 1
#            mode: box
#
# Install
#   Edit dashboard > three-dot menu > Raw configuration editor, then paste everything below
#   as a new item under `views:`. Do a hard refresh (Ctrl+Shift+R) after saving.
#
# Using it
#   Tap a stack to select it. Right-click (or Ctrl-click, or long-press) a stack tile for its
#   more-info dialog. The Reload button re-scans the compose files of that site only.

type: sections
max_columns: 4
title: Docker Stacks
path: docker-stacks-v4
sections:
- type: grid
  cards:
  - type: custom:button-card
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    triggers_update: all
    custom_fields:
      content: |
        [[[
        const S = states;
        const G = (window.__dcm = window.__dcm || {});
        if (G.E !== hass.entities) { G.E = hass.entities; G.byDev = null; }
        if (G.D !== hass.devices) { G.D = hass.devices; G.kids = null; }
        if (!G.byDev) {
          G.byDev = {};
          for (const e of Object.values(hass.entities)) {
            if (e.device_id) (G.byDev[e.device_id] = G.byDev[e.device_id] || []).push(e.entity_id);
          }
        }
        if (!G.kids) {
          G.kids = {};
          for (const [id, d] of Object.entries(hass.devices)) {
            if (d.via_device_id) (G.kids[d.via_device_id] = G.kids[d.via_device_id] || []).push(id);
          }
        }
        const kindOf = (d, k) => {
          for (const id of (G.byDev[d] || [])) {
            if (S[id] && S[id].attributes && S[id].attributes.kind === k) return id;
          }
          return null;
        };
        const NAV_VER = 4;
        if (!window.__dcmNavState || window.__dcmNavState.v !== NAV_VER) {
          // Versioned, so a changed dashboard replaces the old handlers instead of being blocked by them.
          const prev = window.__dcmNavState;
          if (prev) {
            window.removeEventListener('click', prev.click, true);
            window.removeEventListener('touchend', prev.touch, prev.touchOpts);
            if (prev.tstart) window.removeEventListener('touchstart', prev.tstart, prev.tstartOpts);
            if (prev.ctx) window.removeEventListener('contextmenu', prev.ctx, true);
          }
          // HA's card action-handler cancels the default action of every click that reaches a card, so
          // anything clickable inside a button-card's HTML is handled here, in the capture phase.
          const haEl = () => document.querySelector('home-assistant');
          const callSvc = (domain, service, data) => { const h = haEl(); if (h && h.hass) h.hass.callService(domain, service, data); };
          const moreInfo = (node, entityId) => node.dispatchEvent(new CustomEvent('hass-more-info', { detail: { entityId: entityId }, bubbles: true, composed: true }));
          const hideTip = () => { const t = document.getElementById('dcm-tip'); if (t) t.remove(); };
          const toggleTip = (node) => {
            const text = node.dataset.dcmTip;
            const r = node.getBoundingClientRect();
            const key = text + '|' + Math.round(r.top) + '|' + Math.round(r.left);
            const old = document.getElementById('dcm-tip');
            if (old) { const same = old.dataset.key === key; old.remove(); if (same) return; }
            const el = document.createElement('div');
            el.id = 'dcm-tip';
            el.dataset.key = key;
            el.textContent = text;
            el.style.cssText = 'position:fixed;z-index:99999;max-width:260px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.4;background:var(--card-background-color,#202020);color:var(--primary-text-color,#fff);border:1px solid var(--divider-color,#555);box-shadow:0 2px 8px rgba(0,0,0,0.4);';
            document.body.appendChild(el);
            const w = el.offsetWidth, h = el.offsetHeight;
            el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
            el.style.top = ((r.bottom + 6 + h > window.innerHeight) ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
          };
          const go = (path) => {
            if (window.location.pathname === path) return;
            const ha = haEl();
            const before = ha && ha.hass ? ha.hass.panelUrl : null;
            window.history.pushState(null, '', path);
            window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false }, bubbles: true, composed: true }));
            // if HA's router didn't pick the change up, fall back to a normal page load
            setTimeout(() => {
              const now = ha && ha.hass ? ha.hass.panelUrl : null;
              if (!ha || now === before) window.location.assign(path);
            }, 600);
          };
          const KEYS = ['dcmTip', 'dcmPath', 'dcmSelect', 'dcmMore', 'dcmReload'];
          const scan = (ev) => {
            for (const n of (ev.composedPath ? ev.composedPath() : [])) {
              if (n && n.dataset) { for (const k of KEYS) { if (n.dataset[k]) return { key: k, node: n }; } }
            }
            return null;
          };
          const act = (hit, ev) => {
            const n = hit.node, v = n.dataset[hit.key];
            const modified = ev.ctrlKey || ev.metaKey || ev.shiftKey;
            if (hit.key === 'dcmTip') toggleTip(n);
            else if (hit.key === 'dcmPath') { if (modified) window.open(v, '_blank'); else go(v); }
            else if (hit.key === 'dcmSelect') {
              if (modified) moreInfo(n, v);
              else callSvc('input_text', 'set_value', { entity_id: 'input_text.selected_stack', value: v });
            }
            else if (hit.key === 'dcmMore') moreInfo(n, v);
            else if (hit.key === 'dcmReload') {
              if (window.confirm(n.dataset.dcmConfirm || 'Reload?')) callSvc('homeassistant', 'reload_config_entry', { entity_id: v });
            }
          };
          let ts = null;
          const onStart = (ev) => { const t = ev.touches && ev.touches[0]; ts = t ? { x: t.clientX, y: t.clientY, at: Date.now() } : null; };
          const onClick = (ev) => {
            const hit = scan(ev);
            if (!hit) { hideTip(); return; }
            ev.stopPropagation();
            ev.preventDefault();
            if (hit.key !== 'dcmTip') hideTip();
            act(hit, ev);
          };
          const onTouch = (ev) => {
            const hit = scan(ev);
            if (!hit) return;
            const t = ev.changedTouches && ev.changedTouches[0];
            if (ts && t && (Math.abs(t.clientX - ts.x) > 10 || Math.abs(t.clientY - ts.y) > 10)) return; // a scroll, not a tap
            if (ts && Date.now() - ts.at > 500) return; // a long press: the context menu takes it
            ev.stopPropagation();
            ev.preventDefault();
            if (hit.key !== 'dcmTip') hideTip();
            act(hit, ev);
          };
          const onCtx = (ev) => {
            const hit = scan(ev);
            if (!hit || hit.key !== 'dcmSelect') return;
            ev.stopPropagation();
            ev.preventDefault();
            moreInfo(hit.node, hit.node.dataset.dcmSelect);
          };
          const touchOpts = { capture: true, passive: false };
          const tstartOpts = { capture: true, passive: true };
          window.addEventListener('click', onClick, true);
          window.addEventListener('touchend', onTouch, touchOpts);
          window.addEventListener('touchstart', onStart, tstartOpts);
          window.addEventListener('contextmenu', onCtx, true);
          window.__dcmNavState = { v: NAV_VER, click: onClick, touch: onTouch, touchOpts: touchOpts, tstart: onStart, tstartOpts: tstartOpts, ctx: onCtx };
        }
        const DOMAIN = 'ha_docker_compose';
        const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const pretty = (slug) => String(slug || 'Docker').replace(/[_-]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
        // only look at this integration's entities (registry data is cached until it changes)
        if (G.OE !== hass.entities) { G.OE = hass.entities; G.own = null; }
        if (!G.own) {
          G.own = Object.keys(hass.entities).filter((id) => hass.entities[id].platform === DOMAIN);
          if (!G.own.length) G.own = Object.keys(S).filter((id) => S[id].attributes && S[id].attributes.kind);
        }
        const selHelper = S['input_text.selected_stack'];
        const selected = selHelper ? selHelper.state : '';
        const stacks = [];
        const totals = {};
        for (const id of G.own) {
          const st = S[id];
          if (!st || !st.attributes) continue;
          const k = st.attributes.kind;
          if (k === 'stack_state') stacks.push({ id: id, name: st.attributes.stack || id, site: st.attributes.site || '', state: st.state, dev: hass.entities[id] && hass.entities[id].device_id });
          else if (k === 'site_total_cpu' || k === 'site_total_memory') { const site = st.attributes.site || ''; (totals[site] = totals[site] || {})[k] = id; }
        }
        const siteNames = Array.from(new Set(Object.keys(totals).concat(stacks.map((x) => x.site)))).sort((x, y) => x.localeCompare(y));
        if (!stacks.length && !siteNames.length) return '<div class="dcm-empty" style="color:var(--secondary-text-color);font-size:12px;"><em>No Docker Compose Manager stacks found. Add the integration first.</em></div>';
        const multi = siteNames.length > 1;
        const isActive = (x) => x.state === 'running' || x.state === 'updating' || x.state === 'partial';
        const byName = (x, y) => x.name.localeCompare(y.name);
        const updState = (x) => { const uid = kindOf(x.dev, 'stack_update_available'); const u = uid ? S[uid] : null; return (u && u.state !== 'unknown' && u.state !== 'unavailable') ? u.state : null; };
        const ICONS = { running: ['mdi:play-circle', 'var(--success-color, green)'], updating: ['mdi:progress-clock', 'var(--info-color, #378ADD)'], partial: ['mdi:alert-circle', 'var(--warning-color, #FAC775)'] };
        const tile = (x, showSite) => {
          const ic = ICONS[x.state] || ['mdi:stop-circle', 'var(--disabled-text-color, grey)'];
          const u = updState(x);
          const bits = [];
          if (showSite) bits.push(esc(pretty(x.site)));
          if (u === 'on') bits.push('update available'); else if (u === 'off') bits.push('up to date');
          return '<div class="dcm-tile' + (selected === x.id ? ' dcm-sel' : '') + '" data-dcm-select="' + esc(x.id) + '">'
            + (u === 'on' ? '<ha-icon class="dcm-badge" icon="mdi:arrow-up-bold-circle"></ha-icon>' : '')
            + '<ha-icon icon="' + ic[0] + '" style="color:' + ic[1] + ';--mdc-icon-size:24px;"></ha-icon>'
            + '<div class="dcm-name">' + esc(x.name) + '</div>'
            + (bits.length ? '<div class="dcm-label">' + bits.join(' &middot; ') + '</div>' : '')
            + '</div>';
        };
        const fmt = (id) => {
          const t = id ? S[id] : null;
          if (!t || t.state === 'unknown' || t.state === 'unavailable') return 'n/a';
          const u = t.attributes.unit_of_measurement;
          return esc(t.state + (u ? ' ' + u : ''));
        };
        const btn = (icon, name, value, attrs, one) => '<div class="dcm-btn' + (one ? ' dcm-one' : '') + (attrs ? '' : ' dcm-off') + '" ' + attrs + '>'
          + '<ha-icon icon="' + icon + '" style="--mdc-icon-size:26px;"></ha-icon>'
          + '<div class="dcm-btn-t"><div class="dcm-btn-n">' + name + '</div>' + (value === null ? '' : '<div class="dcm-btn-v">' + value + '</div>') + '</div></div>';
        const css = '<style>'
          + '.dcm-h{font-size:1.15em;font-weight:500;margin:4px 2px 8px;}'
          + '.dcm-h.dcm-sub{margin-top:16px;}'
          + '.dcm-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}'
          + '.dcm-btn,.dcm-tile{box-sizing:border-box;border-radius:var(--ha-card-border-radius,12px);border:1px solid var(--ha-card-border-color,var(--divider-color,#444));background:var(--ha-card-background,var(--card-background-color,#202020));cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s;}'
          + '.dcm-btn:hover,.dcm-tile:hover{background:var(--secondary-background-color,#2a2a2a);}'
          + '.dcm-btn{height:52px;padding:6px 12px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;}'
          + '.dcm-btn.dcm-off{opacity:.4;pointer-events:none;}'
          + '.dcm-btn-t{min-width:0;}'
          + '.dcm-btn-n{font-size:11px;color:var(--secondary-text-color);}'
          + '.dcm-btn-v{font-size:15px;font-weight:500;white-space:nowrap;}'
          + '.dcm-btn.dcm-one .dcm-btn-n{font-size:14px;color:var(--primary-text-color);}'
          + '.dcm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:8px;}'
          + '.dcm-tile{position:relative;min-height:70px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;}'
          + '.dcm-tile.dcm-sel{border:2px solid var(--primary-color);box-shadow:0 0 0 2px var(--primary-color);}'
          + '.dcm-name{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}'
          + '.dcm-label{font-size:11px;color:var(--secondary-text-color);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}'
          + '.dcm-badge{position:absolute;top:6px;right:6px;--mdc-icon-size:16px;color:var(--warning-color,#FAC775);}'
          + '.dcm-empty{color:var(--secondary-text-color);font-size:12px;margin:0 2px 8px;}'
          + '</style>';
        let out = css + '<div style="text-align:left;">';
        for (const site of siteNames) {
          const tot = totals[site] || {};
          const mine = stacks.filter((x) => x.site === site).sort(byName);
          const active = mine.filter(isActive);
          // reloading any entity of a config entry reloads the whole entry (= this site)
          const target = tot.site_total_cpu || tot.site_total_memory || (mine[0] && mine[0].id) || '';
          const reload = target ? 'data-dcm-reload="' + esc(target) + '" data-dcm-confirm="' + esc('Reload all stacks on ' + pretty(site) + '? This re-scans every compose file on that host.') + '"' : '';
          const more = (id) => id ? 'data-dcm-more="' + esc(id) + '"' : '';
          out += '<div class="dcm-h">' + esc(pretty(site)) + '</div>'
            + '<div class="dcm-row">'
            + btn('mdi:refresh', 'Reload', null, reload, true)
            + btn('mdi:cpu-64-bit', 'CPU', fmt(tot.site_total_cpu), more(tot.site_total_cpu), false)
            + btn('mdi:memory', 'RAM', fmt(tot.site_total_memory), more(tot.site_total_memory), false)
            + '</div>'
            + (active.length ? '<div class="dcm-grid">' + active.map((x) => tile(x, false)).join('') + '</div>' : '<div class="dcm-empty">No running stacks.</div>');
        }
        const inactive = stacks.filter((x) => !isActive(x)).sort((x, y) => (x.site.localeCompare(y.site)) || byName(x, y));
        if (inactive.length) out += '<div class="dcm-h dcm-sub">Inactive Stacks</div><div class="dcm-grid">' + inactive.map((x) => tile(x, multi)).join('') + '</div>';
        return out + '</div>';
        ]]]
    styles:
      grid:
      - grid-template-areas: '"content"'
      - grid-template-columns: 1fr
      card:
      - padding: 12px
      - text-align: left
      - cursor: default
      - padding: '0'
      - background: none
      - border: none
      - box-shadow: none
      custom_fields:
        content:
        - display: block
        - justify-self: stretch
        - width: 100%
        - min-width: '0'
        - text-align: left
        - pointer-events: auto
        - user-select: text
    grid_options:
      columns: 12
  column_span: 1
- type: grid
  cards:
  - type: vertical-stack
    grid_options:
      columns: 12
    cards:
    - type: custom:button-card
      triggers_update:
      - input_text.selected_stack
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: navigate
        navigation_path: |
          [[[
          const S = states;
          const G = (window.__dcm = window.__dcm || {});
          if (G.E !== hass.entities) { G.E = hass.entities; G.byDev = null; }
          if (G.D !== hass.devices) { G.D = hass.devices; G.kids = null; }
          if (!G.byDev) {
            G.byDev = {};
            for (const e of Object.values(hass.entities)) {
              if (e.device_id) (G.byDev[e.device_id] = G.byDev[e.device_id] || []).push(e.entity_id);
            }
          }
          if (!G.kids) {
            G.kids = {};
            for (const [id, d] of Object.entries(hass.devices)) {
              if (d.via_device_id) (G.kids[d.via_device_id] = G.kids[d.via_device_id] || []).push(id);
            }
          }
          const kindOf = (d, k) => {
            for (const id of (G.byDev[d] || [])) {
              if (S[id] && S[id].attributes && S[id].attributes.kind === k) return id;
            }
            return null;
          };
          const sel = S['input_text.selected_stack']?.state;
          const selOk = !!(sel && S[sel] && S[sel].attributes && S[sel].attributes.kind === 'stack_state');
          const dev = selOk ? (hass.entities[sel] && hass.entities[sel].device_id) : null;
          const stackEnt = (k) => kindOf(dev, k);
          const usable = (id) => !!(id && S[id] && S[id].state !== 'unavailable');
          return dev ? '/config/devices/device/' + dev : '#';
          ]]]
      custom_fields:
        left: |
          [[[
          return '<span style="font-size:1.3em;font-weight:bold;">Stack Detail</span>';
          ]]]
        right: |
          [[[
          const S = states;
          const G = (window.__dcm = window.__dcm || {});
          if (G.E !== hass.entities) { G.E = hass.entities; G.byDev = null; }
          if (G.D !== hass.devices) { G.D = hass.devices; G.kids = null; }
          if (!G.byDev) {
            G.byDev = {};
            for (const e of Object.values(hass.entities)) {
              if (e.device_id) (G.byDev[e.device_id] = G.byDev[e.device_id] || []).push(e.entity_id);
            }
          }
          if (!G.kids) {
            G.kids = {};
            for (const [id, d] of Object.entries(hass.devices)) {
              if (d.via_device_id) (G.kids[d.via_device_id] = G.kids[d.via_device_id] || []).push(id);
            }
          }
          const kindOf = (d, k) => {
            for (const id of (G.byDev[d] || [])) {
              if (S[id] && S[id].attributes && S[id].attributes.kind === k) return id;
            }
            return null;
          };
          const sel = S['input_text.selected_stack']?.state;
          const selOk = !!(sel && S[sel] && S[sel].attributes && S[sel].attributes.kind === 'stack_state');
          const dev = selOk ? (hass.entities[sel] && hass.entities[sel].device_id) : null;
          const stackEnt = (k) => kindOf(dev, k);
          const usable = (id) => !!(id && S[id] && S[id].state !== 'unavailable');
          const label = selOk ? (S[sel].attributes.stack + ' (' + S[sel].attributes.site + ')') : 'No stack selected';
          return '<span style="font-size:1.1em;text-decoration:underline;color:var(--primary-color,#03a9f4);">' + label + '</span>';
          ]]]
      styles:
        grid:
        - grid-template-areas: '"left right"'
        - grid-template-columns: 1fr auto
        card:
        - padding: 10px
        - cursor: pointer
        custom_fields:
          left:
          - justify-self: start
          right:
          - justify-self: end
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        triggers_update: all
        name: Check for Update
        show_icon: true
        icon: mdi:cloud-search-outline
        tooltip: |
          [[[
          const S = states;
          const G = (window.__dcm = window.__dcm || {});
          if (G.E !== hass.entities) { G.E = hass.entities; G.byDev = null; }
          if (G.D !== hass.devices) { G.D = hass.devices; G.kids = null; }
          if (!G.byDev) {
            G.byDev = {};
            for (const e of Object.values(hass.entities)) {
              if (e.device_id) (G.byDev[e.device_id] = G.byDev[e.device_id] || []).push(e.entity_id);
            }
          }
          if (!G.kids) {
            G.kids = {};
            for (const [id, d] of Object.entries(hass.devices)) {
              if (d.via_device_id) (G.kids[d.via_device_id] = G.kids[d.via_device_id] || []).push(id);
            }
          }
          const kindOf = (d, k) => {
            for (const id of (G.byDev[d] || [])) {
              if (S[id] && S[id].attributes && S[id].attributes.kind === k) return id;
            }
            return null;
          };
          const sel = S['input_text.selected_stack']?.state;
          const selOk = !!(sel && S[sel] && S[sel].attributes && S[sel].attributes.kind === 'stack_state');
          const dev = selOk ? (hass.entities[sel] && hass.entities[sel].device_id) : null;
          const stackEnt = (k) => kindOf(dev, k);
          const usable = (id) => !!(id && S[id] && S[id].state !== 'unavailable');
          if (!selOk) return 'No stack selected';
          return usable(stackEnt('stack_check_button')) ? 'Check this stack for available container updates (registry digest check only, no docker command is run)' : '';
          ]]]
        tap_action: |
          [[[
          const S = states;
          const G = (window.__dcm = window.__dcm || {});
          if (G.E !== hass.entities) { G.E = hass.entities; G.byDev = null; }
          if (G.D !== hass.devices) { G.D = hass.devices; G.kids = null; }
          if (!G.byDev) {
            G.byDev = {};
            for (const e of Object.values(hass.entities)) {
              if (e.device_id) (G.byDev[e.device_id] = G.byDev[e.device_id] || []).push(e.entity_id);
            }
          }
          if (!G.kids) {
            G.kids = {};
            for (const [id, d] of Object.entries(hass.devices)) {
              if (d.via_device_id) (G.kids[d.via_device_id] = G.kids[d.via_device_id] || []).push(id);
            }
          }
          const kindOf = (d, k) => {
            for (const id of (G.byDev[d] || [])) {
              if (S[id] && S[id].attributes && S[id].attributes.kind === k) return id;
            }
            return null;
          };
          const sel = S['input_text.selected_stack']?.state;
          const selOk = !!(sel && S[sel] && S[sel].attributes && S[sel].attributes.kind === 'stack_state');
          const dev = selOk ? (hass.entities[sel] && hass.entities[sel].device_id) : null;
