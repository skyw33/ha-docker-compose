  - type: grid
    cards:
      - type: vertical-stack
        grid_options:
          columns: 12
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: navigate
              navigation_path: |
                [[[
                  const stack = states['input_text.selected_stack']?.state;
                  if (!stack || stack === 'unknown') return '#';
                  const entId = 'sensor.' + stack + '_state';
                  const devId = hass.entities[entId]?.device_id;
                  return devId ? '/config/devices/device/' + devId : '#';
                ]]]
            custom_fields:
              left: >
                [[[ return '<span style="font-size:1.3em;
                font-weight:bold;">Stack Detail</span>'; ]]]
              right: |
                [[[
                  const stack = states['input_text.selected_stack']?.state;
                  const label = (!stack || stack === 'unknown') ? 'No stack selected' : stack;
                  const linkStyle = 'font-size:1.1em; text-decoration:underline; color:var(--primary-color, #03a9f4);';
                  return '<span style="' + linkStyle + '">' + label + '</span>';
                ]]]
            styles:
              grid:
                - grid-template-areas: '"left right"'
                - grid-template-columns: 1fr auto
              card:
                - padding: 10px
                - cursor: pointer
              custom_fields:
                left:
                  - justify-self: start
                right:
                  - justify-self: end
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                triggers_update: all
                name: Check for Update
                show_icon: true
                icon: mdi:cloud-search-outline
                tooltip: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return 'No stack selected';
                    }

                    const ent = states['button.' + stack + '_check_updates'];

                    return (!ent || ent.state === 'unavailable')
                      ? ''
                      : 'Check this stack for available container updates (registry digest check only — no docker command is run, this compares the running image digest against the registry)';
                  ]]]
                tap_action: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return { action: 'none' };
                    }

                    const entId = 'button.' + stack + '_check_updates';
                    const ent = states[entId];

                    if (!ent || ent.state === 'unavailable') {
                      return { action: 'none' };
                    }

                    return {
                      action: 'call-service',
                      service: 'button.press',
                      target: {
                        entity_id: entId
                      }
                    };
                  ]]]
                styles:
                  card:
                    - padding: 10px
                    - opacity: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return '0.35';
                          }

                          const ent = states['button.' + stack + '_check_updates'];

                          return (!ent || ent.state === 'unavailable')
                            ? '0.35'
                            : '1';
                        ]]]
                    - pointer-events: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return 'none';
                          }

                          const ent = states['button.' + stack + '_check_updates'];

                          return (!ent || ent.state === 'unavailable')
                            ? 'none'
                            : 'auto';
                        ]]]
                  name:
                    - font-size: 12px
              - type: custom:button-card
                triggers_update: all
                name: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return 'Start Stack';
                    }

                    const ent = states['switch.' + stack + '_running'];

                    if (!ent || ent.state === 'unavailable') {
                      return 'Start Stack';
                    }

                    return ent.state === 'on'
                      ? 'Stop Stack'
                      : 'Start Stack';
                  ]]]
                show_icon: true
                show_state: false
                icon: mdi:power
                tooltip: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return 'No stack selected';
                    }

                    const ent = states['switch.' + stack + '_running'];

                    if (!ent || ent.state === 'unavailable') {
                      return '';
                    }

                    return ent.state === 'on'
                      ? 'Stop this stack (docker compose stop)'
                      : 'Start this stack (docker compose start)';
                  ]]]
                tap_action: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return { action: 'none' };
                    }

                    const entId = 'switch.' + stack + '_running';
                    const ent = states[entId];

                    if (!ent || ent.state === 'unavailable') {
                      return { action: 'none' };
                    }

                    const isRunning = ent.state === 'on';

                    return {
                      action: 'call-service',
                      service: 'switch.toggle',
                      target: {
                        entity_id: entId
                      },
                      confirmation: {
                        text: (isRunning ? 'Stop ' : 'Start ') + stack + '?'
                      }
                    };
                  ]]]
                styles:
                  card:
                    - padding: 10px
                    - opacity: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return '0.35';
                          }

                          const ent = states['switch.' + stack + '_running'];

                          return (!ent || ent.state === 'unavailable')
                            ? '0.35'
                            : '1';
                        ]]]
                    - pointer-events: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return 'none';
                          }

                          const ent = states['switch.' + stack + '_running'];

                          return (!ent || ent.state === 'unavailable')
                            ? 'none'
                            : 'auto';
                        ]]]
                  name:
                    - font-size: 12px
                  icon:
                    - color: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return 'var(--disabled-text-color, grey)';
                          }

                          const ent = states['switch.' + stack + '_running'];

                          if (!ent || ent.state === 'unavailable') {
                            return 'var(--disabled-text-color, grey)';
                          }

                          return ent.state === 'on'
                            ? 'var(--success-color, green)'
                            : 'var(--disabled-text-color, grey)';
                        ]]]
              - type: custom:button-card
                triggers_update: all
                name: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return 'Restart Stack';
                    }

                    const prefix = 'binary_sensor.' + stack + '_';

                    const updateAvailable = Object.keys(states).some(entityId =>
                      entityId.startsWith(prefix) &&
                      entityId.endsWith('_update_available') &&
                      states[entityId]?.state === 'on'
                    );

                    return updateAvailable
                      ? 'Update Stack'
                      : 'Restart Stack';
                  ]]]
                show_icon: true
                icon: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return 'mdi:restart';
                    }

                    const prefix = 'binary_sensor.' + stack + '_';

                    const updateAvailable = Object.keys(states).some(entityId =>
                      entityId.startsWith(prefix) &&
                      entityId.endsWith('_update_available') &&
                      states[entityId]?.state === 'on'
                    );

                    return updateAvailable
                      ? 'mdi:cloud-download-outline'
                      : 'mdi:restart';
                  ]]]
                tooltip: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return 'No stack selected';
                    }

                    const ent = states['button.' + stack + '_pull_update'];

                    if (!ent || ent.state === 'unavailable') {
                      return '';
                    }

                    const prefix = 'binary_sensor.' + stack + '_';

                    const updateAvailable = Object.keys(states).some(entityId =>
                      entityId.startsWith(prefix) &&
                      entityId.endsWith('_update_available') &&
                      states[entityId]?.state === 'on'
                    );

                    return updateAvailable
                      ? 'Pull the available update and recreate this stack (docker compose pull && docker compose up -d)'
                      : 'Re-run pull & recreate on this stack — same command as when an update is available, just nothing new to fetch (docker compose pull && docker compose up -d)';
                  ]]]
                tap_action: |
                  [[[
                    const stack = states['input_text.selected_stack']?.state;

                    if (!stack || stack === 'unknown' || stack === 'unavailable') {
                      return { action: 'none' };
                    }

                    const entId = 'button.' + stack + '_pull_update';
                    const ent = states[entId];

                    if (!ent || ent.state === 'unavailable') {
                      return { action: 'none' };
                    }

                    const prefix = 'binary_sensor.' + stack + '_';

                    const updateAvailable = Object.keys(states).some(entityId =>
                      entityId.startsWith(prefix) &&
                      entityId.endsWith('_update_available') &&
                      states[entityId]?.state === 'on'
                    );

                    return {
                      action: 'call-service',
                      service: 'button.press',
                      target: {
                        entity_id: entId
                      },
                      confirmation: {
                        text: updateAvailable
                          ? 'Update ' + stack + '?'
                          : 'Restart ' + stack + '?'
                      }
                    };
                  ]]]
                styles:
                  card:
                    - padding: 10px
                    - opacity: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return '0.35';
                          }

                          const ent = states['button.' + stack + '_pull_update'];

                          return (!ent || ent.state === 'unavailable')
                            ? '0.35'
                            : '1';
                        ]]]
                    - pointer-events: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return 'none';
                          }

                          const ent = states['button.' + stack + '_pull_update'];

                          return (!ent || ent.state === 'unavailable')
                            ? 'none'
                            : 'auto';
                        ]]]
                  name:
                    - font-size: 12px
                  icon:
                    - color: |
                        [[[
                          const stack = states['input_text.selected_stack']?.state;

                          if (!stack || stack === 'unknown' || stack === 'unavailable') {
                            return 'var(--disabled-text-color, grey)';
                          }

                          const pullEnt = states['button.' + stack + '_pull_update'];

                          if (!pullEnt || pullEnt.state === 'unavailable') {
                            return 'var(--disabled-text-color, grey)';
                          }

                          const prefix = 'binary_sensor.' + stack + '_';

                          const updateAvailable = Object.keys(states).some(entityId =>
                            entityId.startsWith(prefix) &&
                            entityId.endsWith('_update_available') &&
                            states[entityId]?.state === 'on'
                          );

                          return updateAvailable
                            ? 'orange'
                            : 'var(--primary-text-color)';
                        ]]]
      - type: vertical-stack
        cards:
          - type: markdown
            grid_options:
              columns: 12
            content: >
              {% set stack = states('input_text.selected_stack') %}


              {% if not stack or stack in ['unknown', ''] %}


              *Tap a stack above to see its details here.*


              {% else %}


              {% set config_entity = 'sensor.' ~ stack ~ '_compose_config' %}

              {% set raw_config = state_attr(config_entity, 'compose_config') %}


              {% if raw_config %}


              {% set ns = namespace(services=[], in_services=false, indent=none)
              %}

              {% for line in raw_config.split('\n') %}

              {% if line.strip() == 'services:' %}

              {% set ns.in_services = true %}

              {% elif ns.in_services and ns.indent is none and line.strip() %}

              {% set leading = (line | regex_findall('^ *'))[0] | length %}

              {% if leading > 0 %}

              {% set ns.indent = leading %}

              {% endif %}

              {% endif %}


              {% if ns.in_services and ns.indent is not none %}

              {% set leading = (line | regex_findall('^ *'))[0] | length %}

              {% if line.strip() and leading == ns.indent and
              line.rstrip().endswith(':') %}

              {% set ns.services = ns.services + [line.strip().rstrip(':')] %}

              {% elif line.strip() and leading == 0 and not line.startswith('#')
              %}

              {% set ns.in_services = false %}

              {% endif %}

              {% endif %}

              {% endfor %}


              ### Containers in this stack


              {% macro info(text) -%} <abbr title="{{ text }}" style="cursor:
              help; margin-left: 4px; display: inline-block; vertical-align:
              middle; text-decoration: none; border-bottom: none;"><ha-icon
              icon="mdi:information-outline" style="--mdc-icon-size: 14px;
              color: var(--secondary-text-color);"></ha-icon></abbr> {%-
              endmacro %}


              {% for svc_name in ns.services %}


              {% set stack_slug = stack | slugify %}

              {% set svc_slug = svc_name | slugify %}

              {% set prefix = 'sensor.' ~ stack_slug ~ '_' ~ svc_slug ~ '_' ~
              svc_slug ~ '_' %}

              {% set bsensor_prefix = 'binary_sensor.' ~ stack_slug ~ '_' ~
              svc_slug ~ '_' ~ svc_slug ~ '_' %}


              {% set detected = states(prefix ~ 'detected_version') %}

              {% set pull_target = states(prefix ~ 'pull_target_version') %}

              {% set svc_state = states(prefix ~ 'state') %}

              {% set started_at_raw = states(prefix ~ 'started_at') %}

              {% set update_avail = states(bsensor_prefix ~ 'update_available')
              %}

              {% set gh_release = states(prefix ~ 'latest_github_release') %}

              {% set gh_url = state_attr(prefix ~ 'latest_github_release',
              'release_url') %}

              {% set gh_link = ('<a href="' ~ gh_url ~ '">Github release</a>')
              if gh_url else 'Github release' %}

              {% set reg_tag = states(prefix ~ 'latest_registry_tag') %}


              {% if svc_state == 'running' and started_at_raw not in ['unknown',
              'unavailable', none, ''] %}

              {% set uptime = relative_time(as_datetime(started_at_raw)) %}

              {% elif svc_state != 'running' %}

              {% set uptime = 'Stopped' %}

              {% else %}

              {% set uptime = 'n/a' %}

              {% endif %}


              {% macro clean(v) -%}

              {{ v if v not in ['unknown', 'unavailable', none, ''] else 'n/a'
              }}

              {%- endmacro %}


              {% set svc_entity = prefix ~ 'state' %}

              {% set dev_id = device_id(svc_entity) %}


              {% if svc_state == 'running' %}

              {% set link_color = '#4caf50' %}

              {% else %}

              {% set link_color = '#9e9e9e' %}

              {% endif %}


              <div style="display: flex; gap: 16px; align-items: center;
              margin-bottom: 16px;">


              <div style="flex: 0 0 240px; text-align: center; background:
              var(--card-background-color, #202020); border: 1px solid
              var(--divider-color, #333); border-radius: 12px; padding: 16px
              8px;">


              <a href="{{ '/config/devices/device/' ~ dev_id if dev_id else '#'
              }}" style="text-decoration: none;"><font color="{{ link_color }}"
              size="5"><strong>{{ svc_name }}</strong></font></a>{% if
              update_avail == 'on' %}&nbsp;&nbsp;<font
              color="orange"><strong>Update Available</strong></font>{% endif %}


              </div>


              <div style="flex: 1; overflow-x: auto;">


              <table style="width: 100%; border-collapse: collapse; text-align:
              left; line-height: 1.5;">

              <tbody>


              <tr style="border-bottom: 1px solid var(--divider-color, #333);">

              <td style="padding: 4px 0;"><strong>Uptime</strong></td>

              <td style="padding: 4px 0;"><code>{{ uptime }}</code></td>

              </tr>


              <tr style="border-bottom: 1px solid var(--divider-color, #333);">

              <td style="padding: 4px 0;"><strong>Current version</strong> {{
              info('The version currently running, detected from the image tag
              or label') }}</td>

              <td style="padding: 4px 0;"><code>{{ clean(detected)
              }}</code></td>

              </tr>


              <tr style="border-bottom: 1px solid var(--divider-color, #333);">

              <td style="padding: 4px 0;"><strong>Pull target</strong> {{
              info('The version you would get if you pulled updates right now')
              }}</td>

              <td style="padding: 4px 0;"><code>{{ clean(pull_target)
              }}</code></td>

              </tr>


              <tr style="border-bottom: 1px solid var(--divider-color, #333);">

              <td style="padding: 4px 0;"><strong>{{ gh_link }}</strong> {{
              info("The latest release published on the project's GitHub repo")
              }}</td>

              <td style="padding: 4px 0;"><code>{{ clean(gh_release)
              }}</code></td>

              </tr>


              <tr>

              <td style="padding: 4px 0;"><strong>Registry tag</strong> {{
              info('The newest real version tag found on the image registry')
              }}</td>

              <td style="padding: 4px 0;"><code>{{ clean(reg_tag) }}</code></td>

              </tr>


              </tbody>

              </table>


              </div>

              </div>


              <hr style="border: 0; border-top: 1px solid var(--divider-color,
              #333); margin: 16px 0;" />


              {% endfor %}


              {% endif %}

              {% endif %}
      - type: markdown
        grid_options:
          columns: 12
        title: Compose Config
        content: >
          {% set stack = states('input_text.selected_stack') %}

          {% set config_entity = 'sensor.' ~ stack ~ '_compose_config' %}

          {% set raw_config = state_attr(config_entity, 'compose_config') %}

          {% if raw_config %}

          ```yaml
            
          {{ raw_config }}
            
          ```

          {% else %}

          *No compose config available for this stack (entity may be disabled,
          or has not been polled yet).*

          {% endif %}
